<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva – Book a table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { brand: '#e5097f', 'brand-soft': '#fde7f3', soon: '#f59e0b', ink: '#1b1220' }
      } }
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="font-sans text-ink bg-white antialiased">

  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-4">
      <a href="#/" class="text-2xl font-extrabold tracking-tight">reserva<span class="text-brand">.</span></a>
      <div class="hidden sm:flex items-center gap-2 text-sm bg-neutral-100 rounded-full px-4 py-2 ml-2">
        <span class="font-semibold">Pretoria</span><span class="text-neutral-500">Tonight, 2 guests</span>
      </div>
      <div class="flex-1"></div>
      <button id="myBookingsBtn" class="text-sm font-semibold rounded-full bg-neutral-100 hover:bg-neutral-200 px-4 py-2">My bookings <span id="bkCount" class="ml-1 text-brand">0</span></button>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 pb-24"></main>

  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"></div>

  <script src="app.js" onerror="document.getElementById('app').innerHTML='<p class=&quot;mt-10 text-center text-neutral-600&quot;>Could not load app.js. Keep index.html, styles.css and app.js in the same folder.</p>'"></script>
</body>
</html>
